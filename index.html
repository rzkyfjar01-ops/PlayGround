ition:relative;transition:.2s;overflow:hidden}.slot.installed{border:1px solid #515e3c;background:linear-gradient(135deg,#272d21,#1c2119)}.slot[data-type="gpu"]{grid-column:1/3;flex-direction:row;gap:10px}.slot[data-type="motherboard"]{grid-column:1/2;grid-row:2/4}.slot[data-type="ram"]{grid-column:2/3}.slot[data-type="storage"]{grid-column:2/3}.slot .sloticon{font-size:18px;opacity:.8}.slot.installed .sloticon{color:var(--lime)}.slotname{font-size:9px;color:#b1b2bb;font-weight:700;text-transform:uppercase;letter-spacing:.65px}.slotpart{font-size:9px;color:var(--lime);margin-top:3px;text-align:center;padding:0 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot.empty .slotname{color:#858691}.case-logo{position:absolute;bottom:5px;right:14px;color:#63656f;font-size:8px;letter-spacing:2px;font-weight:800}.bench-floor{height:1px;width:90%;position:absolute;bottom:21px;background:linear-gradient(90deg,transparent,#62636b,transparent);box-shadow:0 0 24px #ffffff1a}.empty-hint{position:absolute;bottom:2px;color:var(--muted);font-size:10px}.case-light{position:absolute;inset:30px 21px 43px;border-radius:8px;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,#c8f1690d,transparent 65%)}.build-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px}.costline{display:flex;gap:15px;font-size:11px;color:var(--muted)}.costline b{color:#f2f2f3}.action-btn{border:0;border-radius:7px;padding:10px 15px;background:var(--lime);color:#171a0d;font-size:11px;font-weight:850;letter-spacing:.2px;box-shadow:0 4px 15px #c8f1691c;transition:transform .15s,filter .15s}.action-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.action-btn:disabled{background:#3a3b40;color:#777982;box-shadow:none;cursor:not-allowed;transform:none}.catalog{margin-top:17px}.catalog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.catalog-head .section-title{margin:0}.filter{color:var(--muted);font-size:10px}.parts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.part{padding:11px;border:1px solid var(--line);border-radius:9px;background:#1a1b20;cursor:pointer;transition:.16s;min-width:0}.part:hover{border-color:#666975;background:#202127;transform:translateY(-1px)}.part.selected{border-color:var(--lime);background:#22271d;box-shadow:inset 0 0 0 1px #c8f16925}.part.locked{opacity:.52;cursor:not-allowed}.part-top{display:flex;justify-content:space-between;gap:5px;align-items:center}.part-icon{font-size:16px}.part-price{font-size:11px;font-weight:750;color:#e3e3e7}.part-name{font-size:11px;font-weight:700;margin:7px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.part-meta{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}.tier{color:var(--lime);font-weight:700}.rightcol .card{padding:17px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:11px 10px;border:1px solid #303138;border-radius:8px;background:#1b1c21}.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.stat-value{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-top:5px}.stat-value small{font-size:10px;color:var(--muted);font-weight:600}.stat-note{font-size:9px;color:var(--muted);margin-top:2px}.scorecard{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.score-row{display:flex;justify-content:space-between;font-size:10px;color:#bcbcc4;margin:8px 0}.score-row b{color:#f1f1f3}.score-row .good{color:var(--lime)}.score-row .warn{color:var(--amber)}.order-empty{text-align:center;padding:15px 5px;color:var(--muted);font-size:11px;line-height:1.5}.ticker{font-size:10px;color:var(--muted);line-height:1.55}.ticker-item{padding:9px 0;border-bottom:1px solid #303138}.ticker-item:last-child{border-bottom:0;padding-bottom:0}.ticker-item strong{display:block;font-weight:650;color:#d6d6dc}.ticker-item span{font-size:9px;color:#888a94}.modal-backdrop{position:fixed;inset:0;z-index:10;background:#090a0ccc;backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px}.modal{width:min(435px,100%);background:#1b1c21;border:1px solid #43444c;border-radius:15px;padding:25px;box-shadow:0 24px 80px #0009;animation:pop .25s ease}@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}.modal-icon{font-size:32px;margin-bottom:9px}.modal h2{font-size:23px;margin:0 0 5px;letter-spacing:-.5px}.modal p{font-size:12px;color:#b8b8c0;line-height:1.6}.result-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.result-line span{color:var(--muted)}.result-line strong{color:var(--lime)}.modal .action-btn{margin-top:17px;width:100%;padding:12px}.notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#25272d;border:1px solid #494b55;padding:10px 15px;border-radius:8px;font-size:11px;color:#f1f1f3;opacity:0;transition:.25s;z-index:20;pointer-events:none;box-shadow:0 8px 24px #0007}.notice.show{opacity:1;transform:translateX(-50%) translateY(0)}.reset{border:0;background:none;color:#858690;font-size:10px;padding:4px}.reset:hover{color:#f2f2f2}

@media(max-width:760px){.topbar{height:58px;padding:0 15px;gap:12px}.brand{min-width:0}.brandname small,.nav{display:none}.topright{gap:8px}.day-pill{display:none}.layout{padding:16px;display:flex;flex-direction:column;gap:14px}.maincol{order:0;width:100%}.leftcol{order:1;width:100%;display:grid;grid-template-columns:1fr}.rightcol{order:2;width:100%;display:grid;grid-template-columns:1fr 1fr}.mainhead h1{font-size:22px}.bench{padding:15px;min-height:365px}.case-wrap{height:290px}.case{transform:scale(.92) perspective(900px) rotateY(-5deg)}.build-footer{gap:10px}.costline{gap:8px;font-size:10px}.parts-grid{gap:7px}.part{padding:9px}.job-card{padding:15px}.career{display:none}.tip{margin:0}.rightcol .card{padding:13px}}
@media(max-width:430px){.cash-pill{padding:7px;font-size:10px}.avatar{display:none}.layout{padding:12px}.bench{min-height:350px}.case{transform:scale(.84) perspective(900px) rotateY(-5deg)}.case-wrap{height:275px}.build-footer{align-items:flex-start;flex-direction:column}.build-footer .action-btn{width:100%}.rightcol{grid-template-columns:1fr}.mainhead{align-items:flex-start}.progress-label{font-size:10px}}

<body><div class="app" id="app"></div><div class="notice" id="notice"></div>
<script>
const PARTS={
 gpu:[{name:'ArcSpark 6G',price:180,tier:1,stat:'48 FPS',icon:'▰',unlock:1},{name:'NVIDIA GeForce RTX 4060',price:320,tier:2,stat:'82 FPS',icon:'▰',unlock:1},{name:'Radeon RX 7800 XT',price:510,tier:3,stat:'126 FPS',icon:'▰',unlock:2},{name:'GeForce RTX 5080',price:850,tier:4,stat:'188 FPS',icon:'▰',unlock:4}],
 cpu:[{name:'Intel Core i3-13100F',price:120,tier:1,stat:'4 cores',icon:'▦',unlock:1},{name:'AMD Ryzen 5 7600',price:220,tier:2,stat:'6 cores',icon:'▦',unlock:1},{name:'Intel Core i7-14700K',price:420,tier:3,stat:'20 cores',icon:'▦',unlock:2},{name:'AMD Ryzen 9 9950X',price:690,tier:4,stat:'16 cores',icon:'▦',unlock:4}],
 motherboard:[{name:'B760M Pro WiFi',price:115,tier:1,stat:'LGA1700',icon:'▤',unlock:1},{name:'B650 Aorus Elite',price:170,tier:2,stat:'AM5',icon:'▤',unlock:1},{name:'Z790 ROG Strix',price:280,tier:3,stat:'LGA1700',icon:'▤',unlock:2},{name:'X870E Creator',price:390,tier:4,stat:'AM5',icon:'▤',unlock:4}],
 ram:[{name:'16GB DDR4 3200',price:45,tier:1,stat:'16 GB',icon:'▥',unlock:1},{name:'32GB DDR5 6000',price:90,tier:2,stat:'32 GB',icon:'▥',unlock:1},{name:'64GB DDR5 6400',price:180,tier:3,stat:'64 GB',icon:'▥',unlock:2},{name:'96GB DDR5 7200',price:290,tier:4,stat:'96 GB',icon:'▥',unlock:4}],
 storage:[{name:'512GB NVMe Gen3',price:40,tier:1,stat:'3,500 MB/s',icon:'▱',unlock:1},{name:'1TB NVMe Gen4',price:75,tier:2,stat:'7,000 MB/s',icon:'▱',unlock:1},{name:'2TB NVMe Gen5',price:155,tier:3,stat:'12,000 MB/s',icon:'▱',unlock:2},{name:'4TB NVMe Gen5',price:260,tier:4,stat:'14,000 MB/s',icon:'▱',unlock:4}]
};
const TYPES=['gpu','cpu','motherboard','ram','storage'];const LABELS={gpu:'Graphics card',cpu:'Processor',motherboard:'Motherboard',ram:'Memory',storage:'Storage'};const ICONS={gpu:'▰',cpu:'▦',motherboard:'▤',ram:'▥',storage:'▱'};
const JOBS=[
 {title:'First Gaming Rig',client:'Maya Chen · New creator',quote:'“I’m starting a streaming channel and need a solid 1080p gaming PC. Nothing fancy, just smooth gameplay and room to grow!”',min:{gpu:1,cpu:1,motherboard:1,ram:1,storage:1},fps:55,ram:16,budget:790,reward:1040,bonus:180},
 {title:'The Smooth Streamer',client:'Leo Martinez · Content creator',quote:'“I need to game and stream at the same time. Keep it quiet, give me plenty of memory, and make those frames count.”',min:{gpu:2,cpu:2,motherboard:1,ram:2,storage:2},fps:85,ram:32,budget:1080,reward:1450,bonus:250},
 {title:'Studio Workhorse',client:'Aria Patel · 3D artist',quote:'“My render times are eating into my sleep. Build something that can chew through big scenes and multitask like a champ.”',min:{gpu:3,cpu:3,motherboard:2,ram:3,storage:2},fps:120,ram:64,budget:1720,reward:2240,bonus:360},
 {title:'The Final Boss',client:'Noah Kim · Esports pro',quote:'“No compromises. I want a top-tier machine that absolutely demolishes 4K games and stays relevant for years.”',min:{gpu:4,cpu:4,motherboard:3,ram:4,storage:4},fps:180,ram:96,budget:2720,reward:3520,bonus:600}
];
let state;function fresh(){return{credits:1100,level:1,xp:0,rep:0,job:0,installed:{},feed:[],completed:0}}function load(){try{return{...fresh(),...JSON.parse(localStorage.getItem('pcsim-save')||'{}')}}catch{return fresh()}}state=load();
const job=()=>JOBS[Math.min(state.job,JOBS.length-1)];
function selected(type){return state.installed[type]||null}function partObj(type,index){return PARTS[type][index]}
function totalCost(){return TYPES.reduce((n,t)=>n+(selected(t)?partObj(t,selected(t)).price:0),0)}
function complete(){return TYPES.every(t=>selected(t)!==null)}
function score(){let j=job(),fps=0,ram=0,tiers=0;TYPES.forEach(t=>{let p=selected(t)==null?null:partObj(t,selected(t));if(p){tiers+=p.tier;if(t==='gpu')fps=[0,48,82,126,188][p.tier];if(t==='ram')ram=[0,16,32,64,96][p.tier]}});return{fps,ram,tiers}}
function meets(){let j=job();return TYPES.every(t=>selected(t)!==null&&partObj(t,selected(t)).tier>=j.min[t])&&score().fps>=j.fps&&score().ram>=j.ram&&totalCost()<=j.budget}
function save(){localStorage.setItem('pcsim-save',JSON.stringify(state))}
function render(){const j=job(),s=score(),budgetPct=Math.min(100,totalCost()/j.budget*100),xpPct=state.xp%100;document.getElementById('app').innerHTML=`
<header class="topbar"><div class="brand"><div class="brandmark">⌘</div><div class="brandname">BENCH &amp; BUILD<small>PC simulator</small></div></div><nav class="nav"><span class="active">WORKSHOP</span><span>PARTS</span><span>CAREER</span></nav><div class="topright"><div class="day-pill">DAY <b>${String(state.completed+1).padStart(2,'0')}</b></div><div class="cash-pill">◈ <strong>$${state.credits.toLocaleString()}</strong></div><div class="avatar">${state.rep>=3?'★':'J'}</div></div></header>
<div class="layout"><aside class="leftcol"><section class="card career"><div class="career-head"><span class="section-title" style="margin:0">YOUR SHOP</span><span class="level">LVL ${state.level}</span></div><div class="shopname">Pixel Forge</div><div class="subtle">Independent PC workshop</div><div class="xp-row"><span>Workshop XP</span><span>${state.xp%100} / 100</span></div><div class="xpbar"><span style="width:${xpPct}%"></span></div></section>
<section class="card job-card"><div class="jobtag">● &nbsp;ACTIVE ORDER</div><div class="jobtitle">${j.title}</div><div class="customer">${j.client}</div><div class="quote">${j.quote}</div><div class="goal-list">${TYPES.map(t=>`<div class="goal"><span>${LABELS[t]}</span><strong>Tier ${j.min[t]}+</strong></div>`).join('')}<div class="goal"><span>Target performance</span><strong>${j.fps}+ FPS · ${j.ram} GB RAM</strong></div><div class="goal"><span>Parts budget</span><strong>$${j.budget}</strong></div></div><div class="reward"><span>Order payout</span><strong>$${j.reward}</strong></div></section>
<div class="card tip"><div class="tipicon">✦</div><div class="tiptext"><b>Builder tip</b><br>Meet every minimum spec and stay under budget for a perfect build bonus.</div></div><button class="reset" onclick="resetGame()">↺ &nbsp;Reset career</button></aside>
<main class="maincol"><div class="mainhead"><div><div class="eyebrow">WORKSHOP / BUILD BAY 01</div><h1>Build the perfect rig.</h1></div><div class="progress-label">BUILD PROGRESS<br><b>${Object.keys(state.installed).length} / 5 components</b></div></div>
<section class="card bench"><div class="bench-head"><div class="section-title">ASSEMBLY TABLE</div><div class="benchmode">⌁ &nbsp;CUSTOM BUILD</div></div><div class="case-wrap"><div class="case-light"></div><div class="case"><div class="case-top"><span></span></div><div class="case-inner">${TYPES.map(t=>{let p=selected(t)==null?null:partObj(t,selected(t));return `<div class="slot ${p?'installed':'empty'}" data-type="${t}" title="Click to remove component" onclick="removePart('${t}')"><span class="sloticon">${p?ICONS[t]:'＋'}</span><span class="slotname">${LABELS[t]}</span>${p?`<span class="slotpart">${p.name}</span>`:''}</div>`}).join('')}</div><div class="case-logo">PIXEL FORGE</div></div><div class="bench-floor"></div><div class="empty-hint">${complete()?'All components installed — run the benchmark':'Select parts below to install them in your build'}</div></div><div class="build-footer"><div class="costline"><span>PARTS COST <b>$${totalCost()}</b></span><span>BUDGET <b style="color:${totalCost()>j.budget?'var(--red)':'#f2f2f3'}">$${j.budget-totalCost()}</b> LEFT</span></div><button class="action-btn" ${complete()?'':'disabled'} onclick="benchmark()">▶ &nbsp;RUN BENCHMARK</button></div></section>
<section class="catalog"><div class="catalog-head"><h2 class="section-title">COMPONENT CATALOG</h2><span class="filter">Click a component to install</span></div><div class="parts-grid">${TYPES.flatMap(t=>PARTS[t].map((p,i)=>{let isSelected=selected(t)===i,locked=state.level<p.unlock;return `<div class="part ${isSelected?'selected':''} ${locked?'locked':''}" onclick="install('${t}',${i})"><div class="part-top"><span class="part-icon">${p.icon}</span><span class="part-price">$${p.price}</span></div><div class="part-name">${p.name}</div><div class="part-meta"><span class="tier">TIER ${p.tier}</span><span>${locked?'🔒 LVL '+p.unlock:p.stat}</span></div></div>`})).join('')}</div></section></main>
<aside class="rightcol"><section class="card"><h2 class="section-title">LIVE SYSTEM READOUT</h2><div class="stats-grid"><div class="stat"><div class="stat-label">Gaming FPS</div><div class="stat-value">${complete()?s.fps:'—'}<small> avg</small></div><div class="stat-note">Target ${j.fps} FPS</div></div><div class="stat"><div class="stat-label">Memory</div><div class="stat-value">${complete()?s.ram:'—'}<small> GB</small></div><div class="stat-note">Target ${j.ram} GB</div></div><div class="stat"><div class="stat-label">Build score</div><div class="stat-value">${complete()?Math.min(99,Math.round(s.tiers/20*100)):'—'}<small> / 100</small></div><div class="stat-note">Parts tier rating</div></div><div class="stat"><div class="stat-label">Budget used</div><div class="stat-value">${complete()?Math.round(totalCost()/j.budget*100):'—'}<small> %</small></div><div class="stat-note">$${totalCost()} / $${j.budget}</div></div></div><div class="scorecard">${TYPES.map(t=>{let p=selected(t)==null?null:partObj(t,selected(t)),ok=p&&p.tier>=j.min[t];return `<div class="score-row"><span>${LABELS[t]}</span><b class="${p?(ok?'good':'warn'):''}">${p?(ok?'✓ Meets spec':'△ Below spec'):'Not installed'}</b></div>`}).join('')}<div class="score-row"><span>Budget check</span><b class="${totalCost()<=j.budget?'good':'warn'}">${totalCost()<=j.budget?'✓ On budget':'△ Over budget'}</b></div></div></section>
<section class="card"><h2 class="section-title">SHOP LOG</h2>${state.feed.length?`<div class="ticker">${state.feed.slice(0,4).map(x=>`<div class="ticker-item"><strong>${x.title}</strong><span>${x.detail}</span></div>`).join('')}</div>`:`<div class="order-empty">Your shop is just getting started.<br>Complete your first build to get noticed.</div>`}</section></aside></div>`;}
function notify(text){const n=document.getElementById('notice');n.textContent=text;n.classList.add('show');clearTimeout(window.noteTimer);window.noteTimer=setTimeout(()=>n.classList.remove('show'),2100)}
function install(type,index){const p=partObj(type,index);if(state.level<p.unlock){notify(`Unlocks at workshop level ${p.unlock}`);return}if(selected(type)===index){removePart(type);return}let refund=selected(type)==null?0:partObj(type,selected(type)).price;let price=p.price-refund;if(price>state.credits){notify('Not enough credits for that component');return}state.credits-=price;state.installed[type]=index;save();render()}
function removePart(type){if(selected(type)===null)return;state.credits+=partObj(type,selected(type)).price;delete state.installed[type];save();render()}
function benchmark(){if(!complete())return;const j=job(),ok=meets(),cost=totalCost(),cash=ok?j.reward+j.bonus:Math.round(j.reward*.45);state.credits+=cash;state.rep+=ok?1:0;state.xp+=100;state.level=Math.min(4,1+Math.floor(state.xp/100));state.completed++;state.feed.unshift({title:ok?'Order completed — '+j.title:'Build needs work — '+j.title,detail:`${ok?'Perfect spec match · bonus earned':'Partial payout · review specs'} · +$${cash.toLocaleString()}`});state.feed=state.feed.slice(0,8);state.installed={};save();render();showResult(ok,j,cost,cash)}
function showResult(ok,j,cost,cash){let wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="modal"><div class="modal-icon">${ok?'🏆':'🛠️'}</div><div class="eyebrow">${ok?'BENCHMARK PASSED':'BENCHMARK COMPLETE'}</div><h2>${ok?'Beautiful build!':'Needs a little tuning.'}</h2><p>${ok?'Every spec checked out. Your customer is thrilled, and you earned the perfect-build bonus.':'The PC runs, but it missed one or more requested specs. You still earned a partial payout. Check the next order carefully.'}</p><div class="result-line"><span>Parts investment</span><strong style="color:#eee">$${cost}</strong></div><div class="result-line"><span>Customer payout</span><strong>+$${cash}</strong></div><div class="result-line"><span>Workshop reputation</span><strong>${ok?'+1 star':'No change'}</strong></div><div class="result-line"><span>Workshop level</span><strong>LVL ${state.level}</strong></div><button class="action-btn" onclick="this.closest('.modal-backdrop').remove()">${state.job>=JOBS.length?'KEEP BUILDING':'NEXT ORDER'} &nbsp;→</button></div>`;wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});document.body.appendChild(wrap)}
function resetGame(){if(!confirm('Reset your career and start over?'))return;localStorage.removeItem('pcsim-save');state=fresh();render();notify('Career reset — welcome to the workshop')}
render();
</script></body></html>
